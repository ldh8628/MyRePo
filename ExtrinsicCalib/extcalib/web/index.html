<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>외부 파라미터 계산</title>
<style>
  :root { --bg:#f4f5f7; --panel:#fff; --ink:#1d2330; --mute:#667085; --line:#d0d5dd; --accent:#2563eb;
          --ok:#067647; --warn:#b54708; --bad:#b42318; --code:#f2f4f7; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
          --bg:#11151c; --panel:#1a2029; --ink:#e6e9ef; --mute:#98a2b3; --line:#344054; --accent:#60a5fa;
          --ok:#47cd89; --warn:#fdb022; --bad:#f97066; --code:#222935; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.5 "Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif; }
  header { padding:18px 24px 6px; } h1 { font-size:20px; margin:0; } .sub { color:var(--mute); font-size:13px; }
  main { padding:12px 24px 40px; display:grid; gap:16px; max-width:1200px; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:820px) { .row { grid-template-columns:1fr; } main, header { padding-left:16px; padding-right:16px; } }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .card h2 { font-size:15px; margin:0 0 10px; display:flex; align-items:center; gap:8px; }
  .tag { font-size:11px; padding:1px 7px; border-radius:99px; background:var(--code); color:var(--mute); font-weight:400; }
  label { display:block; font-size:12px; color:var(--mute); margin:8px 0 3px; }
  input, select { width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:8px; background:var(--panel);
                  color:var(--ink); font:inherit; }
  .seg { display:flex; gap:6px; } .seg button { flex:1; }
  button { padding:7px 12px; border:1px solid var(--line); border-radius:8px; background:var(--panel); color:var(--ink);
           font:inherit; cursor:pointer; }
  button.on { background:var(--ink); color:var(--panel); border-color:var(--ink); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; padding:9px 18px; }
  button:disabled { opacity:.5; cursor:default; }
  .pathrow { display:flex; gap:6px; } .pathrow input { flex:1; }
  .browser { margin-top:6px; border:1px solid var(--line); border-radius:8px; max-height:190px; overflow:auto; display:none; }
  .browser div { padding:4px 9px; cursor:pointer; font-size:13px; } .browser div:hover { background:var(--code); }
  .browser .cur { color:var(--mute); font-size:12px; cursor:default; position:sticky; top:0; background:var(--panel); border-bottom:1px solid var(--line); }
  .msg { font-size:12px; margin-top:6px; color:var(--mute); } .msg.bad { color:var(--bad); }
  .bar { height:8px; background:var(--code); border-radius:99px; overflow:hidden; margin:10px 0 6px; }
  .bar i { display:block; height:100%; width:0; background:var(--accent); transition:width .4s; }
  pre { background:var(--code); border-radius:8px; padding:10px; margin:0; font-size:12px; overflow:auto; max-height:200px; }
  table { border-collapse:collapse; width:100%; font-size:13px; } td, th { padding:4px 6px; text-align:left; border-bottom:1px solid var(--line); }
  td.n { text-align:right; font-variant-numeric:tabular-nums; font-family:ui-monospace,Consolas,monospace; }
  .mat td { border:none; padding:2px 8px; } .mat { width:auto; background:var(--code); border-radius:8px; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  .kpi { border:1px solid var(--line); border-radius:10px; padding:8px 10px; }
  .kpi b { display:block; font-size:18px; } .kpi span { font-size:12px; color:var(--mute); }
  .good { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); }
  .figs { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:12px; }
  .figs img { width:100%; border:1px solid var(--line); border-radius:8px; background:#fff; }
  .figs p { margin:4px 0 0; font-size:12px; color:var(--mute); }
  ul.w { margin:6px 0 0; padding-left:18px; } #result { display:none; }
</style>
</head>
<body>
<header>
  <h1>외부 파라미터 계산</h1>
  <div class="sub">동시에 녹화한 두 센서(RGB-D–RGB-D 또는 LiDAR–RGB-D)의 ROS 2 bag에서 두 센서 사이의 위치·자세와 시간차를 구합니다. 표지판(체커보드) 없이, 주행하며 녹화한 데이터만 씁니다.</div>
</header>
<main>
  <div class="row">
    <section class="card" id="cardA">
      <h2>센서 A <span class="tag">기준 좌표계</span></h2>
      <div class="seg"><button data-t="lidar" class="on">LiDAR</button><button data-t="rgbd">RGB-D</button></div>
      <label>bag 폴더</label>
      <div class="pathrow"><input class="path" placeholder="/data/session/lidar"><button class="browse">찾기</button><button class="check">확인</button></div>
      <div class="browser"></div>
      <div class="topics"></div>
      <div class="msg"></div>
    </section>
    <section class="card" id="cardB">
      <h2>센서 B <span class="tag">RGB-D</span></h2>
      <label>bag 폴더</label>
      <div class="pathrow"><input class="path" placeholder="/data/session/camera"><button class="browse">찾기</button><button class="check">확인</button></div>
      <div class="browser"></div>
      <div class="topics"></div>
      <div class="msg"></div>
    </section>
  </div>

  <section class="card">
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <button class="primary" id="run" disabled>계산 시작</button>
      <span class="msg" id="runmsg" style="margin:0">두 센서의 bag 폴더를 확인하면 시작할 수 있습니다. 2분 녹화 기준 3~5분 걸립니다.</span>
    </div>
    <div class="bar"><i id="bar"></i></div>
    <pre id="log">대기 중</pre>
  </section>

  <section id="result">
    <div class="card" style="margin-bottom:16px">
      <h2>결과 <span class="tag" id="rmeta"></span></h2>
      <div class="kpis" id="kpis"></div>
      <div id="warns"></div>
    </div>
    <div class="row">
      <div class="card">
        <h2>T<sub>A←B</sub> <span class="tag">B 좌표를 A 좌표로 옮기는 변환</span></h2>
        <table class="mat" id="mat"></table>
        <table style="margin-top:10px" id="pose"></table>
        <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button id="dl">JSON 내려받기</button><button id="cp">행렬 복사</button></div>
        <div class="msg" id="saved"></div>
      </div>
      <div class="card">
        <h2>점검 지표</h2>
        <table id="checks"></table>
      </div>
    </div>
    <div class="card" style="margin-top:16px">
      <h2>그림</h2>
      <div class="figs" id="figs"></div>
    </div>
  </section>
</main>
<script>
const $ = (s, el=document) => el.querySelector(s);
const state = { a:{type:"lidar", ok:false}, b:{type:"rgbd", ok:false} };
const api = (u, o) => fetch(u, o).then(async r => { const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status); return j; });

function setupCard(key, card) {
  const s = state[key];
  card.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
    card.querySelectorAll(".seg button").forEach(x => x.classList.toggle("on", x === b));
    s.type = b.dataset.t; s.ok = false; $(".topics", card).innerHTML = ""; $(".msg", card).textContent = ""; refresh();
  });
  const input = $(".path", card), br = $(".browser", card), msg = $(".msg", card);
  async function browse(p) {
    try {
      const d = await api("/api/browse?path=" + encodeURIComponent(p || ""));
      br.style.display = "block";
      br.innerHTML = `<div class="cur">${d.path}${d.is_bag ? " · bag" : ""}</div><div data-p="${d.parent}">..</div>` +
        d.dirs.map(n => `<div data-p="${d.path.replace(/\/$/, "")}/${n}">${n}/</div>`).join("");
      br.querySelectorAll("div[data-p]").forEach(el => el.onclick = () => { input.value = el.dataset.p; browse(el.dataset.p); });
    } catch (e) { msg.textContent = e.message; msg.className = "msg bad"; }
  }
  $(".browse", card).onclick = () => br.style.display === "block" ? (br.style.display = "none") : browse(input.value);
  $(".check", card).onclick = async () => {
    br.style.display = "none"; msg.className = "msg"; msg.textContent = "토픽 읽는 중…"; s.ok = false; refresh();
    try {
      const g = await api("/api/topics?path=" + encodeURIComponent(input.value));
      s.path = input.value;
      const want = s.type;
      if (g.type !== want) throw new Error(want === "lidar" ? "PointCloud2 토픽이 없습니다" : "컬러·깊이 Image 토픽이 없습니다");
      const sel = (id, label, list) => `<label>${label}</label><select data-k="${id}">` +
        list.map(t => `<option value="${t}">${t} (${g.counts[t]})</option>`).join("") + `</select>`;
      $(".topics", card).innerHTML = want === "lidar" ? sel("points_topic", "점군 토픽", g.points)
        : sel("color_topic", "컬러 토픽", g.color) + sel("depth_topic", "깊이 토픽 (컬러에 정렬된 것)", g.depth) +
          sel("info_topic", "카메라 정보 토픽", g.info) +
          `<label>깊이 단위 (m / 값)</label><input data-k="depth_scale" value="0.001">`;
      msg.textContent = "확인됨"; msg.className = "msg good"; s.ok = true;
    } catch (e) { msg.textContent = e.message; msg.className = "msg bad"; }
    refresh();
  };
}
function spec(key, card) {
  const s = { type: state[key].type, path: state[key].path };
  card.querySelectorAll("[data-k]").forEach(el => s[el.dataset.k] = el.value);
  return s;
}
function refresh() { $("#run").disabled = !(state.a.ok && state.b.ok); }
setupCard("a", $("#cardA")); setupCard("b", $("#cardB"));

$("#run").onclick = async () => {
  $("#run").disabled = true; $("#result").style.display = "none"; $("#log").textContent = "시작";
  try {
    const { id } = await api("/api/run", { method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ a: spec("a", $("#cardA")), b: spec("b", $("#cardB")) }) });
    history.replaceState(null, "", "?job=" + id); poll(id);
  } catch (e) { $("#log").textContent = e.message; refresh(); }
};
async function poll(id) {
  const j = await api("/api/job?id=" + id);
  $("#bar").style.width = (100 * j.progress).toFixed(0) + "%";
  $("#log").textContent = j.log.join("\n") || "…"; $("#log").scrollTop = 1e9;
  if (j.state === "running") return setTimeout(() => poll(id), 1500);
  refresh();
  if (j.state === "error") { $("#log").textContent += "\n\n오류: " + j.error; return; }
  show(j.result, id);
}
const jobInUrl = new URLSearchParams(location.search).get("job");
if (jobInUrl) poll(jobInUrl).catch(() => { $("#log").textContent = "이전 작업을 찾을 수 없습니다 (서버를 다시 켰으면 사라집니다)"; });
const f = (x, d=3) => Number(x).toFixed(d);
function grade(v, good, okay, lowerBetter=true) {
  const g = lowerBetter ? (v <= good ? "good" : v <= okay ? "warn" : "bad") : (v >= good ? "good" : v >= okay ? "warn" : "bad");
  return `<span class="${g}">${v}</span>`;
}
function fillCard(key, card, sp) {
  if (!sp) return;
  if (key === "a") card.querySelectorAll(".seg button").forEach(x => x.classList.toggle("on", x.dataset.t === sp.type));
  state[key].type = sp.type; $(".path", card).value = sp.path;
}
function show(r, id) {
  fillCard("a", $("#cardA"), r.sensor_a); fillCard("b", $("#cardB"), r.sensor_b);
  $("#result").style.display = "block";
  $("#rmeta").textContent = `${r.seconds} s`;
  const t = r.translation_m, h = r.handeye, c = r.checks;
  $("#kpis").innerHTML = [
    [`${f(t[0])}, ${f(t[1])}, ${f(t[2])}`, "이동 x, y, z [m]"],
    [`${f(r.rpy_deg[0],2)}, ${f(r.rpy_deg[1],2)}, ${f(r.rpy_deg[2],2)}`, "회전 roll, pitch, yaw [°]"],
    [`${r.tau_s >= 0 ? "+" : ""}${f(r.tau_s)} s`, "시간차 (B가 늦음)"],
    [`${c.even_odd_split.even_vs_odd_cm} cm · ${c.even_odd_split.even_vs_odd_deg}°`, "데이터 반씩 나눠 푼 차이"],
  ].map(([v, l]) => `<div class="kpi"><b>${v}</b><span>${l}</span></div>`).join("");
  $("#warns").innerHTML = r.warnings.length
    ? `<ul class="w">${r.warnings.map(w => `<li class="warn">${w}</li>`).join("")}</ul>`
    : `<div class="msg good">경고 없음</div>`;
  $("#mat").innerHTML = r.T_a_b.map(row => `<tr>${row.map(v => `<td class="n">${f(v, 5)}</td>`).join("")}</tr>`).join("");
  $("#pose").innerHTML = `<tr><td>쿼터니언 x y z w</td><td class="n">${r.quaternion_xyzw.map(v => f(v, 5)).join(" ")}</td></tr>
     <tr><td>B 시각 → 실제 시각</td><td class="n">t − (${f(r.tau_s)}) s</td></tr>`;
  $("#saved").textContent = r.saved_to ? "저장됨: " + r.saved_to : "";
  const rows = [
    ["시간차 일치 오차", grade(r.time_offset.median_angle_err_deg, 0.5, 1.0), "° / 1 s 회전"],
    ["시간차 확실성 (2등/1등)", grade(r.time_offset.next_best_ratio, 1.5, 1.2, false), "클수록 좋음"],
    ["움직임 쌍", h.pairs, "개"],
    ["평면 주행", h.planar_motion ? "예" : "아니오", h.planar_motion ? "높이·기울기는 바닥으로" : "3차원 움직임"],
    ["회전 잔차 중앙값", grade(h.rot_residual_median_deg, 0.8, 1.5), "°"],
    ["이동 잔차 중앙값", grade(h.trans_residual_median_cm, 3, 6), "cm"],
    ["B / A 이동 거리 비", h.scale_b_over_a, "1에 가까울수록 좋음"],
  ];
  if (r.floor && r.floor.used) rows.push(["바닥 높이 A / B", `${r.floor.a.height_m} / ${r.floor.b.height_m}`, "m"],
                         ["바닥으로 고친 양", `${r.change_by_floor.cm} cm · ${r.change_by_floor.deg}°`, ""]);
  if (r.floor && !r.floor.used) rows.push(["바닥 사용", '<span class="bad">아니오</span>', "높이 미정"]);
  if (c.lidar_on_depth) rows.push(["LiDAR 점이 깊이 면 3 cm 안", grade(c.lidar_on_depth.within_3cm, 0.3, 0.2, false), `중앙값 ${c.lidar_on_depth.median_cm} cm`]);
  $("#checks").innerHTML = rows.map(([a, b, u]) => `<tr><td>${a}</td><td class="n">${b}</td><td style="color:var(--mute);font-size:12px">${u}</td></tr>`).join("");
  const scale = Math.abs(h.scale_b_over_a - 1);
  $("#checks").rows[6].cells[1].innerHTML = `<span class="${scale < 0.02 ? "good" : scale < 0.04 ? "warn" : "bad"}">${h.scale_b_over_a}</span>`;
  const figs = [
    [r.figures.top, "1초마다의 움직임: A의 실제 움직임(파랑)과 B의 움직임을 결과로 A에 옮긴 것(주황). 맞으면 두 선이 포개집니다."],
    [r.figures.tau, "시간차 탐색: 회전량이 가장 잘 맞는 시간차(빨간 선)."],
    [r.figures.overlay, "LiDAR 점을 컬러 영상에 투영(거리별 색). 벽·물체 모서리에 맞으면 정확합니다."],
  ].filter(x => x[0]);
  $("#figs").innerHTML = figs.map(([src, cap]) => `<div><img src="${src}" alt=""><p>${cap}</p></div>`).join("");
  $("#dl").onclick = () => location.href = "/api/download?id=" + id;
  $("#cp").onclick = () => navigator.clipboard.writeText(JSON.stringify(r.T_a_b));
}
</script>
</body>
</html>
